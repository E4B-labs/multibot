<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">MultiBot</title>
  <desc id="desc">Zielony zaokrąglony trójkąt skierowany w prawo, w środku dwa białe paski pauzy, na czarnym kaflu.</desc>

  <rect width="1024" height="1024" rx="224" fill="#000000" />

  <!-- Trójkąt rysowany obrysem z zaokrąglonymi złączeniami: to samo co
       zaokrąglone wierzchołki, bez liczenia trzech łuków ręcznie. Wierzchołki
       są wsunięte o połowę grubości obrysu, żeby zewnętrzny obrys trafił
       w zamierzony rozmiar. -->
  <path d="M362 210 L362 774 L659 492 Z"
        fill="#2FBC4F" stroke="#2FBC4F" stroke-width="60" stroke-linejoin="round" />

  <rect x="437" y="426" width="58" height="130" rx="29" fill="#FFFFFF" />
  <rect x="528" y="451" width="52" height="107" rx="26" fill="#FFFFFF" />
</svg>
