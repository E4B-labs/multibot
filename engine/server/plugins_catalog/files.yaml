# Jedyny wpis stdio. Referencyjny serwer MCP z organizacji modelcontextprotocol,
# odpalany przez `npx` — bez zdalnego hosta, więc bez URL-a do potwierdzenia
# (nie zmyślamy adresów: dla usług, których endpointu nie mamy z pewnego źródła,
# idzie wpis stdio).
#
# `args[2]` = katalog, do którego serwer ma dostęp; sam serwer wymaga podania go
# jawnie i sandboksuje się do niego. `.` = katalog roboczy procesu bota.
# ponytail: stała ścieżka zamiast pola w UI — konfigurowalny root dochodzi, gdy
# ktoś tego naprawdę zażąda.
name: files
display_name: Files
description: Czytaj i zapisuj pliki w katalogu roboczym bota (referencyjny serwer filesystem).
command: npx
args:
  - "-y"
  - "@modelcontextprotocol/server-filesystem"
  - "."
# BRAK klucza `auth` (nie `auth: none`) — `auth` jest w `_SPEC_KEYS`, więc
# pojechałoby do `mcp_servers`, a Hermes zna tam wyłącznie wartość `oauth`
# (mcp-config-reference.md). Brak klucza = `plugins._connected` → true.
featured: false
source: https://github.com/modelcontextprotocol/servers/tree/main/src/filesystem
