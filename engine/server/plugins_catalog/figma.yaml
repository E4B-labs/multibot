# URL potwierdzony: hermes-agent/optional-mcps/figma/manifest.yaml.
#
# Figma allowlistuje przy DCR dokładne `client_name` — Hermes sam podstawia
# "Claude Code" (`tools/mcp_oauth.apply_oauth_provider_defaults`), więc flow
# startuje bez ręcznego client_id. Nic po naszej stronie.
name: figma
display_name: Figma
description: Kontekst projektowy, Code Connect i zapis na kanwę przez oficjalny zdalny MCP Figmy.
url: https://mcp.figma.com/mcp
transport: http
auth: oauth
featured: true
source: https://developers.figma.com/docs/figma-mcp-server/remote-server-installation/
