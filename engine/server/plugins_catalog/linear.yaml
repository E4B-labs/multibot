# Wpis katalogu slafy-bota. Format MINIMALNY (nie manifest_version 1 Hermesa):
# name / display_name / description / url|command / transport? / auth /
# tools_count? / featured. Klucze poza białą listą `app._SPEC_KEYS` NIE lecą do
# `mcp_servers` w config.yaml — obce klucze potrafią wywalić wpis jako
# "suspicious" (`hermes_cli/mcp_security.py`, patrz docstring `server/plugins.py`).
#
# URL potwierdzony: hermes-agent/optional-mcps/linear/manifest.yaml (`/mcp`, NIE
# `/sse` — Streamable HTTP z natywnym OAuth 2.1 + DCR).
name: linear
display_name: Linear
description: Znajduj, twórz i aktualizuj zgłoszenia, projekty i komentarze w Linearze.
url: https://mcp.linear.app/mcp
transport: http
auth: oauth
featured: true
source: https://linear.app/docs/mcp
