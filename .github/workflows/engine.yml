# multibot: pytest silnika (engine/). Workflow ich harnessa (ci.yml) nietknięty.
name: engine
on:
  push:
    branches: [main]
    paths: ["engine/**", ".github/workflows/engine.yml"]
  pull_request:
    paths: ["engine/**", ".github/workflows/engine.yml"]

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install engine deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      # hermes-agent: build backend odrzuca wheel/sdist, tylko editable;
      # core.longpaths dla MAX_PATH na windows (docusaurus i18n w repo hermesa)
      - name: Install hermes-agent (editable @ 17688f9)
        run: |
          git config --global core.longpaths true
          git clone --filter=blob:none https://github.com/NousResearch/hermes-agent ${{ runner.temp }}/hermes-agent
          git -C ${{ runner.temp }}/hermes-agent checkout 17688f9
          pip install -e ${{ runner.temp }}/hermes-agent
      # PLAYWRIGHT_BROWSERS_PATH w obu stepach ta sama — inaczej chromium
      # ląduje gdzie indziej, niż go szukają testy (i gateway). Kontekst
      # `runner` nie działa w env na poziomie joba, stąd per-step.
      - name: Install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw-browsers
        run: python -m playwright install chromium --with-deps
      # linux pod xvfb: sesje przeglądarek bota są headed (take-over),
      # bez X serwera chromium pada na "The platform failed to initialize"
      - name: Run pytest (linux)
        if: runner.os == 'Linux'
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw-browsers
          SLAFY_DATA_DIR: ${{ runner.temp }}/slafy-data
          HERMES_HOME: ${{ runner.temp }}/slafy-data
        run: xvfb-run --auto-servernum python -m pytest -q --basetemp="${{ runner.temp }}/pytest"
      - name: Run pytest (windows)
        if: runner.os == 'Windows'
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw-browsers
          SLAFY_DATA_DIR: ${{ runner.temp }}/slafy-data
          HERMES_HOME: ${{ runner.temp }}/slafy-data
        run: python -m pytest -q --basetemp="${{ runner.temp }}/pytest"
